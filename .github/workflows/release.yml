name: Release

# 打标签即发布：git tag v1.0.1 && git push --tags
on:
  push:
    tags: ["v*"]

# 创建 Release 需要写权限
permissions:
  contents: write

defaults:
  run:
    working-directory: rust/snap

jobs:
  windows:
    name: Windows 发布包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/snap

      # 发布前先把质量门槛过一遍，别把没测过的代码发出去
      - name: 标签与版本号一致性检查
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "标签 $GITHUB_REF_NAME 与 Cargo.toml 里的版本 v$VERSION 不一致，中止"
            exit 1
          fi
          echo "版本一致: v$VERSION"

      - name: 格式检查
        run: cargo fmt --check

      - name: 静态检查
        run: cargo clippy --all-targets -- -D warnings

      - name: 测试
        run: cargo test

      - name: 场景测试
        shell: bash
        run: |
          if command -v timeout >/dev/null 2>&1; then
            SNAP_SANDBOX="$RUNNER_TEMP/snap-sandbox" timeout 900 bash tests/scenario.sh
          else
            SNAP_SANDBOX="$RUNNER_TEMP/snap-sandbox" bash tests/scenario.sh
          fi

      - name: 打包（含 SHA256）
        shell: bash
        run: bash ../../scripts/package.sh

      - name: 创建 Release（说明取自 CHANGELOG，附上 SHA256）
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          ZIP_PATH="$(ls "$GITHUB_WORKSPACE"/dist/*.zip)"
          SHA_PATH="$(ls "$GITHUB_WORKSPACE"/dist/*.sha256)"
          echo "附上: $ZIP_PATH"

          # 抽 CHANGELOG.md 里这个版本的那一节。
          # 用 index() 而不是正则，省得跟方括号的转义较劲。
          NOTES="$(awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' "$GITHUB_WORKSPACE/CHANGELOG.md")"
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="（CHANGELOG.md 里没有 $VERSION 这一节，记得补上）"
          fi

          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          {
            printf '%s\n' "$NOTES"
            printf '\n---\n\n### 校验值\n\n```\n'
            cat "$SHA_PATH"
            printf '```\n'
          } > "$NOTES_FILE"

          gh release create "$TAG" "$ZIP_PATH" "$SHA_PATH" \
            --title "snap $VERSION" \
            --notes-file "$NOTES_FILE"
