name: Release

# 打标签即发布：git tag v1.0.1 && git push --tags
on:
  push:
    tags: ["v*"]

# 创建 Release 需要写权限
permissions:
  contents: write

defaults:
  run:
    working-directory: rust/snap

jobs:
  windows:
    name: Windows 发布包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/snap

      # 发布前先把质量门槛过一遍，别把没测过的代码发出去
      - name: 标签与版本号一致性检查
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "标签 $GITHUB_REF_NAME 与 Cargo.toml 里的版本 v$VERSION 不一致"
            exit 1
          fi
          echo "版本一致: v$VERSION"

      - name: 格式检查
        run: cargo fmt --check

      - name: 静态检查
        run: cargo clippy --all-targets -- -D warnings

      - name: 测试
        run: cargo test

      - name: 场景测试
        shell: bash
        run: SNAP_SANDBOX="$RUNNER_TEMP/snap-sandbox" bash tests/scenario.sh

      - name: 打包（含 SHA256）
        shell: bash
        run: bash ../../scripts/package.sh

      - name: 创建 Release 并附上产物
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          ZIP_PATH="$(ls "$GITHUB_WORKSPACE"/dist/*.zip)"
          SHA_PATH="$(ls "$GITHUB_WORKSPACE"/dist/*.sha256)"
          echo "附上: $ZIP_PATH"
          # --generate-notes 让 GitHub 按提交自动生成发布说明
          gh release create "$TAG" "$ZIP_PATH" "$SHA_PATH" \
            --title "snap ${TAG#v}" \
            --generate-notes
